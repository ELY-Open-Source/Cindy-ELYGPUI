name: CI

on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: [self-hosted, omarchy-amd64]
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            apt: true
          - target: macos-arm64
            runner: [self-hosted, macos-arm64]
          - target: macos-x64
            runner: macos-15-intel
          - target: windows-x64
            runner: [self-hosted, windows-amd64]
          - target: windows-arm64
            runner: windows-11-arm
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
