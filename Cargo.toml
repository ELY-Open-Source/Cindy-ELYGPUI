[package]
name = "cindy"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Cindy, ported to Rust on GPUI and Ely GPUI Components."
repository = "https://github.com/ELY-Open-Source/Cindy-ELYGPUI"
publish = false

[dependencies]
anyhow = "1"
dirs = "7"
ely-gpui-component = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "e0f355ac1a669c24336244bcaa8131f7f0e4f1b5" }
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "wayland", "x11"] }
icu_collator = "2"
icu_decimal = "2"
icu_locale_core = "2"
icu_plurals = "2"
jiff = "0.2"
log = "0.4"
notify = "8.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sys-locale = "0.3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
regex = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
