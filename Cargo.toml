[package]
name = "cindy"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Cindy, ported to Rust on GPUI and Ely GPUI Components."
repository = "https://github.com/ELY-Open-Source/Cindy-ELYGPUI"
publish = false

[dependencies]
anyhow = "1"
dirs = "7"
ely-gpui-component = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "e0f355ac1a669c24336244bcaa8131f7f0e4f1b5" }
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "wayland", "x11"] }
icu_collator = "2"
icu_decimal = "2"
icu_locale_core = "2"
icu_plurals = "2"
image = { version = "0.25.10", default-features = false, features = ["webp"] }
jiff = "0.2"
log = "0.4"
notify = "8.2.1"
indexmap = "2"
markdown = "1"
regex = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "functions"] }
raw-window-handle = { version = "0.6.2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10.9"
sqlite-vec = "=0.1.9"
stacker = "0.1.25"
sys-locale = "0.3"
uuid = { version = "1.29.1", features = ["v4"] }

[dev-dependencies]
ely-gpui-component = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "e0f355ac1a669c24336244bcaa8131f7f0e4f1b5", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace", "NSApplication", "NSResponder", "NSImage", "NSView", "NSVisualEffectView", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSArray", "NSEnumerator", "NSGeometry", "NSValue", "NSURL", "NSError", "NSString", "NSDictionary"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "block2", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
block2 = "0.6.2"
tempfile = "3"
objc2 = "0.6.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_System_Threading", "Wdk_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
